name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Install Criterion and Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y libcriterion-dev valgrind

    - name: Build libraries and tests
      run: make all

    - name: Run tests
      run: make run_tests

    - name: Valgrind tests
      run: make valgrind_tests
